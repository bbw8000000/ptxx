<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(335, 62%, 62%)"/>
      <stop offset="100%" stop-color="hsl(12, 58%, 52%)"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="900" height="350" rx="16" fill="url(#bg)"/>
  <!-- 装饰 -->
  <circle cx="780" cy="60" r="120" fill="white" opacity="0.06"/>
  <circle cx="100" cy="300" r="60" fill="white" opacity="0.04"/>
  <!-- 标签 -->
  <rect x="60" y="70" width="80" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="100" y="89" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle" opacity="0.9">GROWTH</text>
  <!-- 主标题 -->
  <text x="60" y="150" font-family="'Noto Serif SC', 'LXGW WenKai', Georgia, serif" font-size="44" font-weight="700" fill="white" letter-spacing="1">一次难得的相遇</text>
  <!-- 副标题 -->
  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="22" fill="white" opacity="0.8">遇见内心通透的人</text>
  <!-- 序号 -->
  <text x="830" y="320" font-family="system-ui, sans-serif" font-size="14" fill="white" opacity="0.3" text-anchor="end">相遇</text>
  <!-- 插画：两个相交的圆，象征相遇与共鸣 -->
  <g transform="translate(720, 165)" fill="none" stroke="white" stroke-width="3" opacity="0.9">
    <circle cx="-24" cy="0" r="46" opacity="0.85"/>
    <circle cx="24" cy="0" r="46" opacity="0.85"/>
    <path d="M0,-58 L10,-40 L0,-22 L-10,-40 Z" fill="white" stroke="none" opacity="0.9"/>
  </g>
</svg>
