name: Deploy API

# Deploys the auth + comments + translation API (Cloudflare Pages Functions + D1).
#
# Deliberately separate from the GitHub Pages workflows: path filters mean it
# only runs when API code changes, and its own concurrency group means an API
# deploy can neither block nor cancel a site deploy.
#
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Required repository variable: PUBLIC_API_BASE (consumed by the Pages workflows)
#
# One-time setup before the first run of this workflow:
#   npx wrangler d1 create blog-comments          # put the id in wrangler.toml
#   npx wrangler pages project create blog-api    # then this workflow can deploy
#   npx wrangler pages secret put PBKDF2_PEPPER --project-name blog-api
#
# Translation (optional feature: /api/translate turns foreign READMEs into Chinese
# summaries). Without the key below the endpoint answers 503 and the project pages
# simply fall back to the "use your browser's translate" hint — the site still
# builds and works.
#   npx wrangler pages secret put DEEPSEEK_API_KEY --project-name blog-api
#
# The key must live ONLY as a Cloudflare secret. It is never written to this repo,
# never included in the built site, and never sent to a browser: the frontend calls
# /api/translate and the key stays server-side.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'migrations/**'
      - 'wrangler.toml'
      - 'scripts/build-api-dist.mjs'
      - 'scripts/verify-api.sh'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: api-deploy
  # Unlike the site workflows, do not cancel a run in progress: a half-applied
  # D1 migration is worse than a queued deploy.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 显式声明最小权限：这个工作流只需要读仓库内容，其余一律不给
    # （此前未声明，等于继承仓库默认权限）。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check the API
        run: npx tsc -p functions/tsconfig.json --noEmit

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply blog-comments --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy Pages Functions
        run: |
          npm run build:api
          npx wrangler pages deploy .pages-dist --project-name blog-api --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
